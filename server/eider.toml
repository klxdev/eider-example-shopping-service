[package]
name = "server"
version = "0.1.0"
main = "main.ei"
eider = "0.7"
description = "The Eider Shop's server: REST + OpenAPI (eider-openapi), a JSON-RPC admin API (eider-rpc), the front end's files, on eider-http"

# Every dependency is granted exactly what the program loads of it uses, no more; the
# compiler checks it on every build (E0204) and `eider tree` shows it.

# the shop's rules, shared with the web page as WebAssembly: pure, granted nothing
[deps.shared]
path = "../shared"

# the request bodies' derived decoders, and reading JSON in the end-to-end test; pure
[deps.json]
git = "https://github.com/klxdev/eider-json.git"
version = "0.7.0"

# the server (sockets, deadlines, worker threads), the client of the end-to-end test, and
# the middleware (access log, metrics)
[deps.http]
git = "https://github.com/klxdev/eider-http.git"
version = "0.7.0"
uses = ["clock", "fs", "io", "net", "threads"]

# structured logging (the startup and shutdown lines, the access log's Logger): eider-http's
# middleware takes a logging.Logger
[deps.logging]
git = "https://github.com/klxdev/eider-logging.git"
version = "0.7.0"
uses = ["io", "clock"]

# operations, validation and /openapi.json: pure, granted nothing
[deps.openapi]
git = "https://github.com/klxdev/eider-openapi.git"
version = "0.7.0"

# JSON-RPC 2.0 (the admin API): the server side needs nothing, but the client in the same
# module uses the network (TODO(eider-rpc#2), eider-lang#60: grants per imported module)
[deps.rpc]
git = "https://github.com/klxdev/eider-rpc.git"
version = "0.7.0"
uses = ["net", "io", "clock"]

# `eider lint` (scripts/test.sh): every lint is an error here, so a new finding fails the tests;
# there is nothing to allow
[lints]
all = "deny"
